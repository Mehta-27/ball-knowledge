[project]
name = "ball-knowledge-backend"
version = "0.1.0"
description = "Backend for Ball Knowledge"
requires-python = ">3.13"

dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.138.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
